<script>
const tabs = document.querySelectorAll(".tab");
const panels = document.querySelectorAll(".panel");
const menuTrigger = document.getElementById("menu-trigger");
const navContainer = document.getElementById("nav-container");

// 1. 탭 클릭 시 콘텐츠 전환 및 모바일 메뉴 자동 닫기
tabs.forEach((tab) => {
  tab.addEventListener("click", () => {
    // 활성화 상태 초기화
    tabs.forEach(t => t.classList.remove("active"));
    panels.forEach(p => p.classList.remove("active"));

    // 클릭한 탭과 패널 활성화
    tab.classList.add("active");
    const target = document.getElementById(tab.dataset.target);
    if (target) {
      target.classList.add("active");
    }

    // 모바일 버전일 때: 메뉴 열려있으면 탭 클릭 시 자동으로 닫아줌
    if (window.innerWidth <= 768) {
      menuTrigger.classList.remove("active");
      navContainer.classList.remove("open");
    }
  });
});

// 2. 모바일 햄버거 메뉴 토글 로직
if (menuTrigger && navContainer) {
  menuTrigger.addEventListener("click", () => {
    menuTrigger.classList.toggle("active");
    navContainer.classList.toggle("open");
  });
}

window.addEventListener("load", () => {
    // 주소창에서 # 뒤에 오는 글자(ID)를 가져옴
    const hash = window.location.hash.substring(1); 
    
    if (hash) {
        // 해당 ID를 data-target으로 가진 탭을 찾음
        const targetTab = document.querySelector(`.tab[data-target="${hash}"]`);
        
        if (targetTab) {
            targetTab.click(); // 강제로 클릭 이벤트 발생!
            
            // 페이지 상단으로 스크롤 고정 (필요 시)
            window.scrollTo(0, 0);
        }
    }
});
</script>
